server {
    # Unprivileged image: the worker runs as a non-root user, so listen on a high port
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # API requests go to the backend; Spring Security sets this location's security headers
    # (adding ours too would duplicate X-Frame-Options and similar headers)
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: serve index.html for any route
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
