server {
    listen 80;
    root /usr/share/nginx/html;

    # API сұраныстары бэкендке
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
    }

    # React Router: кез келген бетті index.html береді
    location / {
        try_files $uri /index.html;
    }
}
