spring:
  application:
    name: korkem-invoice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/korkem_invoice}
    username: ${DB_USER:${USER:postgres}}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8090}
  # Trust X-Forwarded-For only from internal proxies (nginx), to log/throttle the real client IP
  forward-headers-strategy: native

app:
  # dev | prod. In prod the server refuses to start with default secrets or insecure cookies.
  env: ${APP_ENV:dev}
  jwt:
    # Required in prod: a random string of at least 32 characters
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-1234}
    ttl-hours: 12
  auth:
    cookie:
      name: korkem_token
      # Required true in prod (HTTPS only)
      secure: ${COOKIE_SECURE:false}
    login:
      # Lock a username/IP pair after this many failed logins within the window
      max-failures: 5
      window-minutes: 15
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    # Created on first start when there are no users. In prod ADMIN_PASSWORD must be set (8+ chars, not "admin").
    username: admin
    password: ${ADMIN_PASSWORD:admin}
  company:
    # Printed on documents (form Z-2)
    name: ${COMPANY_NAME:Körkem ЖШС}
    # IIN/BIN (12 digits); leave empty to print blank boxes
    bin: ${COMPANY_BIN:}
    chief-accountant: ${COMPANY_CHIEF_ACCOUNTANT:қарастырылмаған}
    release-allowed-by: ${COMPANY_RELEASE_ALLOWED_BY:Палымбетов Н.М.}
  vat:
    # VAT rate in percent, included in prices. Changing it affects new and edited invoice lines only.
    rate: ${VAT_RATE:16}
