# Run the whole stack: cp .env.example .env, fill in the secrets, then docker compose up --build
# Only the web front (nginx) is published; the database and the API stay on the internal network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: korkem_invoice
      POSTGRES_USER: korkem
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DB_URL: jdbc:postgresql://db:5432/korkem_invoice
      DB_USER: korkem
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${PUBLIC_URL:-https://localhost}
      VAT_RATE: ${VAT_RATE:-12}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:8080"

volumes:
  db-data:
