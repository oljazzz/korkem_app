# Weekly pull requests for outdated dependencies; security fixes come as soon as an advisory appears
# (turn on "Dependabot security updates" in the repository's settings for those).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    # The single-image build (/) and the two-container setup (frontend/, backend/)
    directories: [/, /frontend, /backend]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
